{% extends 'base.html' %}{% block heading %}Marks{% endblock %}{% block content %}<section class="panel"><h2>Add Marks</h2><form method="post" class="grid"><select name="student_id" required>{% for s in students %}<option value="{{s.id}}">{{s.roll_no}} - {{s.name}}</option>{% endfor %}</select><input name="subject" placeholder="Subject" required><input name="marks" type="number" min="0" max="100" placeholder="Marks" required><button>Save Marks</button></form></section><section class="panel"><h2>Marks Records</h2><table><tr><th>Roll</th><th>Name</th><th>Subject</th><th>Marks</th></tr>{% for m in marks %}<tr><td>{{m.roll_no}}</td><td>{{m.name}}</td><td>{{m.subject}}</td><td>{{m.marks}}</td></tr>{% endfor %}</table></section>{% endblock %}
