{% extends 'base.html' %}{% block heading %}Attendance{% endblock %}{% block content %}<section class="panel"><h2>Mark Attendance</h2><form method="post" class="grid"><select name="student_id" required>{% for s in students %}<option value="{{s.id}}">{{s.roll_no}} - {{s.name}}</option>{% endfor %}</select><input type="date" name="date" required><select name="status"><option>Present</option><option>Absent</option></select><button>Save</button></form></section><section class="panel"><h2>Attendance Records</h2><table><tr><th>Date</th><th>Roll</th><th>Name</th><th>Status</th></tr>{% for a in attendance %}<tr><td>{{a.date}}</td><td>{{a.roll_no}}</td><td>{{a.name}}</td><td>{{a.status}}</td></tr>{% endfor %}</table></section>{% endblock %}
