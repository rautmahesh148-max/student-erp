{% extends 'base.html' %}{% block heading %}Students{% endblock %}{% block content %}<section class="panel"><h2>Add Student</h2><form method="post" class="grid"><input name="roll_no" placeholder="Roll No" required><input name="name" placeholder="Name" required><input name="email" placeholder="Email"><input name="course" placeholder="Course"><input name="semester" placeholder="Semester"><input name="phone" placeholder="Phone"><button>Add Student</button></form></section><section class="panel"><h2>Student List</h2><table><tr><th>Roll</th><th>Name</th><th>Email</th><th>Course</th><th>Semester</th><th>Phone</th></tr>{% for s in students %}<tr><td>{{s.roll_no}}</td><td>{{s.name}}</td><td>{{s.email}}</td><td>{{s.course}}</td><td>{{s.semester}}</td><td>{{s.phone}}</td></tr>{% endfor %}</table></section>{% endblock %}
