{% extends 'base.html' %}{% block heading %}Notice Board{% endblock %}{% block content %}<section class="panel"><h2>Publish Notice</h2><form method="post"><input name="title" placeholder="Notice title" required><textarea name="message" placeholder="Notice message" required></textarea><button>Publish</button></form></section><section class="panel">{% for n in notices %}<article class="notice"><h3>{{n.title}}</h3><p>{{n.message}}</p><small>{{n.created_at}}</small></article>{% endfor %}</section>{% endblock %}
